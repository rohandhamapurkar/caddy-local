name: caddy-local
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
      - '127.0.0.1:8888:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - local-apps
    restart: unless-stopped
networks:
  local-apps:
    external: true
volumes:
  caddy-data:
  caddy-config:
